name: CI

# The release workflow only runs on `release: published`, so before this existed the tests,
# the compile and lint were first exercised *after* a release had been cut — and a commit that
# broke them was discovered by the release failing, leaving a published release with no APK.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: read # karoo-ext from GitHub Packages

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # settings.gradle.kts resolves GitHub Packages credentials from these
      USERNAME: ${{ github.actor }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test

      - name: Android lint
        run: ./gradlew lint

      # Deliberately debug, not release: this workflow has no signing secrets, and
      # app/build.gradle.kts now refuses to debug-sign a release build under CI.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Debug-signed, and the debug build shares its applicationId with the release one, so
      # this APK cannot be installed over a real-key build: INSTALL_FAILED_UPDATE_INCOMPATIBLE,
      # and the uninstall that clears it takes the couple code and the rest of the settings with
      # it. It is for trying a branch on a spare device, not for upgrading a rider's Karoo.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          # error, not ignore: the build step above succeeded, so a missing APK here means the
          # output path moved and the artifact would be silently empty.
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
