name: Release build

on:
  release:
    types: [published]

permissions:
  contents: write # upload the APK to the release
  packages: read  # karoo-ext from GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # settings.gradle.kts resolves GitHub Packages credentials from these
      USERNAME: ${{ github.actor }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test

      - name: Build release APK
        env:
          # Real release signing key (see CLAUDE.md); app/build.gradle.kts falls back to
          # debug-signing if these are absent, but that would break in-place updates for
          # anyone who already installed a real-key build.
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "partnerride-${{ github.event.release.tag_name }}.apk"
          gh release upload "${{ github.event.release.tag_name }}" "partnerride-${{ github.event.release.tag_name }}.apk" --clobber
