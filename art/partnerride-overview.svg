<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="ttl dsc">
<title id="ttl">What PartnerRide does</title>
<desc id="dsc">Two riders, each with a Karoo. Both get their position from GPS and send it straight to the other bike over Bluetooth — no internet, no phone. Because the position you receive is a moment old, it is moved forward to where your partner is now, and the distance between you appears on your ride screen.</desc>
